name: Tests

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

# Cancel any in-progress run on the same ref when a new one is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Godot 4 headless unit tests
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.6.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> $GITHUB_PATH

      - name: Verify Godot version
        run: godot --version

      - name: Cache import artifacts
        uses: actions/cache@v4
        with:
          path: .godot/
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.gd', '**/*.tscn', '**/*.tres', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      # First pass discovers and imports all resources including GUT addon files.
      - name: Import project (first pass)
        run: godot --headless --import 2>&1 || true

      # Second pass ensures all class_name declarations (especially from GUT) are
      # registered in .godot/global_script_class_cache.cfg. Without this,
      # gut_cmdln.gd silently calls quit(0) before running any tests.
      - name: Import project (second pass — register class_names)
        run: godot --headless --import 2>&1 || true

      # Fail early with a clear message if GUT classes are still missing after
      # both import passes, rather than letting GUT exit 0 with zero tests run.
      - name: Verify GUT classes are registered
        shell: bash
        run: |
          CACHE_FILE=".godot/global_script_class_cache.cfg"
          if [[ ! -f "$CACHE_FILE" ]]; then
            echo "ERROR: $CACHE_FILE not found — import may have failed."
            exit 1
          fi
          if ! grep -q "GutTest" "$CACHE_FILE"; then
            echo "ERROR: GutTest class not found in $CACHE_FILE"
            echo "Import did not register GUT's class_names. Re-run or check Godot output above."
            exit 1
          fi
          echo "GUT classes verified in class cache."

      # GUT CLI runs only tests/unit/domain/ as configured in .gutconfig.json.
      # -glog=2 overrides the config log level to show each test result in CI.
      - name: Run domain tests (GUT CLI)
        run: godot --headless -s addons/gut/gut_cmdln.gd -glog=2
        timeout-minutes: 5

      # Legacy runner covers the full suite: domain + application + platform + simulation.
      - name: Run full suite (legacy runner)
        run: godot --headless --script tests/test_runner.gd
        timeout-minutes: 10
